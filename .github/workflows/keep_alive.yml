name: Keep Streamlit App Alive

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC) to prevent the 12-hour idle sleep threshold
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ping Streamlit App & Wake if Sleeping
        run: |
          python3 << 'PYEOF'
          import time
          from playwright.sync_api import sync_playwright

          app_url = "https://customer--churn-predictor.streamlit.app/"
          print(f"Pinging {app_url}...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(app_url, timeout=60000)
              print(f"Status: {response.status if response else 'No response'}")
              time.sleep(5)

              # Check if sleeping wake-up button exists
              wake_btn = page.locator('button:has-text("Yes, get this app back up")')
              if wake_btn.count() > 0 and wake_btn.is_visible():
                  print("App is asleep. Clicking wake-up button...")
                  wake_btn.click()
                  time.sleep(10)
                  print("Wake-up signal sent successfully!")
              else:
                  print("App is awake and responsive.")

              browser.close()
          PYEOF
